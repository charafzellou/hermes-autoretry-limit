name: hermes-autoretry-limit
version: "0.2.0"
description: >
  Detects a subscription usage-window halt (Claude Pro/Max OAuth, OpenAI Codex
  ChatGPT plan, Z.AI GLM Coding Plan), makes Hermes stop immediately instead of
  retrying into a closed window, reads when the blocking 5-hour or weekly
  window reopens from the provider's own usage API, and schedules a one-shot
  `hermes cron` job that resumes the session then — repeating every window
  until the turn succeeds. A resume firing while the window is still closed
  re-schedules its own re-check ~55 minutes out, safely inside Hermes's
  one-hour script timeout. Never fires for API-key billing exhaustion.
author: "hermes-autoretry-limit contributors"
license: MIT
provides_hooks:
  - transform_api_error_classification
  - api_request_error
